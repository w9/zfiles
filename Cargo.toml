[package]
name = "zfiles"
version = "0.2.57"
edition = "2024"
license = "MIT"
build = "build.rs"

[features]
default = []
dev-frontend = ["dep:tokio-tungstenite"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
mime_guess = "2"
notify = "8"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.29", features = ["zerocopy"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
qrcode = "0.14"
sha2 = "0.10"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"], optional = true }

[dev-dependencies]
axum-test = "17"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: release packaging smoke
        run: ./scripts/test-release-packaging.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: build frontend
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - uses: Swatinem/rust-cache@v2.9.0

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy -- -D warnings

      - name: cargo test
        run: cargo test

      - name: perf smoke
        run: cargo test --test perf

      - name: build zfiles binary
        run: cargo build

      - name: e2e smoke
        run: |
          cd e2e
          pnpm install
          pnpm exec playwright install chromium --with-deps
          pnpm test

      - name: cargo deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check

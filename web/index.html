<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zfiles</title>
    <script>
      (function () {
        var localeKey = "zfiles-locale";
        var params = new URLSearchParams(window.location.search);
        var urlLocale = params.get("lang") || params.get("locale");
        var locale = urlLocale || localStorage.getItem(localeKey);
        if (urlLocale === "zh-CN" || urlLocale === "zh") {
          locale = "zh-CN";
          localStorage.setItem(localeKey, "zh-CN");
        } else if (urlLocale === "en") {
          locale = "en";
          localStorage.setItem(localeKey, "en");
        }
        document.documentElement.lang = locale === "zh-CN" ? "zh-CN" : "en";

        var key = "zfiles-theme";
        var mode = localStorage.getItem(key);
        if (mode !== "light" && mode !== "dark" && mode !== "auto") {
          mode = "auto";
        }
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var resolved =
          mode === "auto" ? (prefersDark ? "dark" : "light") : mode;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.classList.toggle("dark", resolved === "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

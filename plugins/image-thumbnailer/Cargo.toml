[package]
name = "image-thumbnailer"
version = "0.1.0"
edition = "2021"

[lib]
name = "image_thumbnailer"
path = "src/lib.rs"

[[bin]]
name = "image-thumbnailer"
path = "src/bin/image-thumbnailer.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "avif"] }
kamadak-exif = "0.6"
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
webp = "0.3"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

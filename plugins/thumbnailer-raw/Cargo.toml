[package]
name = "thumbnailer-raw"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "thumbnailer-raw"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
image-thumbnailer = { path = "../image-thumbnailer" }
rawloader = "0.37"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
